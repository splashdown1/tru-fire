<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a100c">
<title>TRU FIRE</title>
<style>
:root{--bg:#1a100c;--ink:#f6ecdf;--dim:#c4aa90;--line:#3e2a20;--flame:#e28a4a;--card:#26180f;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--flame)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#120e0a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--flame);color:#1a100c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--flame);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>FIRE</span></h1><p class="sub">Site, fuel ladder, dead out. FM 21-76. Not a friction-fire recipe.</p></header>
<div class="warn">Clear a circle at least 1 meter across. Scrape to soil. A fire you cannot put dead out is a fire you do not light. Gasoline on a fire is not packed.</div>
<div class="bar"><input id="q" placeholder="tinder, site, out…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Before you light",d:"Decide the ground, the weather, the fuel you have, the time you have, and why you need the fire. A dry spot, out of the wind, where the heat goes where you want it, with wood in reach. If a shelter is up, the fire sits in relation to it, not in it."},
{t:"The circle",d:"In woods or brush, clear the brush and scrape the surface soil. Clear a circle at least 1 meter in diameter so the fire has little chance to spread. If time allows, a wall of logs or rocks on the windward side."},
{t:"Tinder",d:"What takes the first flame. Birch bark. Shredded inner bark of cedar, chestnut, red elm. Fine wood shavings. Dead grass, ferns, moss, fungi. Straw. Sawdust. Fine pitchwood scrapings. Dead evergreen needles. Punk, the rotted heart of a dead log. Evergreen knots. Bird down. Dry seed down of milkweed, cattail, bulrush, thistle. Dried vegetable fiber. Dead palm leaves. The skin inside bamboo. Pocket lint. Charred cloth. Waxed paper. Outer bamboo shavings. Cotton lint."},
{t:"Kindling",d:"What takes the tinder's flame and holds it. Small twigs. Small strips of wood. Split wood. Heavy cardboard. Wood taken from the inside of a larger piece. The manual also lists wood doused with gasoline, oil, or wax. This ship does not teach pouring fuel on a flame."},
{t:"Fuel",d:"What keeps it. Dry standing wood and dry dead branches. The dry heart of a fallen trunk. Green wood only if it is finely split. Dry grass twisted into bunches. Peat dry enough to burn, from the top of an undercut bank. Dried dung. Animal fat. Coal, oil shale, or oil already lying on the surface. Do not dig a seam this card does not describe."},
{t:"Lay it small to large",d:"Tinder, then kindling, then fuel. The flame climbs. A log on a spark dies. Add fuel only after the kindling has a flame you can hear."},
{t:"Dead out",d:"Water it. Stir the ash. Water it again. If you can still feel heat, it is not out. Scatter only what is cold. Embers travel in a boot and in a wind."},
{t:"Gap",d:"Bow drill, fire plow, and the ratio of those sets are not packed. The manual says the only way to learn that ratio is practice. This ship will not invent it. Lifeline holds the rest of the survival book."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">FIRE</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 21-76 firecraft: site, 1 meter circle, tinder, kindling, fuel. Dead-out is the stop rule.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented fire set.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
